name: Release

# Pushing a tag like v0.2.0 builds the installer and publishes a GitHub release, which
# installed copies pick up as an update. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, pack and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $cargo = (Select-String Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($version -ne $cargo) { throw "Tag v$version doesn't match the Cargo.toml version $cargo" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --workspace

      - name: Install vpk (same version as the velopack crate)
        shell: pwsh
        run: |
          $lock = Get-Content Cargo.lock -Raw
          $velopack = [regex]::Match($lock, 'name = "velopack"\s+version = "([^"]+)"').Groups[1].Value
          if (-not $velopack) { throw 'velopack not found in Cargo.lock' }
          dotnet tool install -g vpk --version $velopack
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Download the previous release (for delta updates)
        # The first release has nothing to download.
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir installer/Releases

      - name: Build and pack
        shell: pwsh
        run: ./installer/package.ps1 -Version $env:VERSION

      - name: Publish the release
        run: vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir installer/Releases --publish --releaseName "ClipFrame ${{ env.VERSION }}" --tag ${{ github.ref_name }}
