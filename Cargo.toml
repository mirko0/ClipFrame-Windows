[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# internal
cf-core = { path = "crates/cf-core" }
cf-platform = { path = "crates/cf-platform" }
cf-render = { path = "crates/cf-render" }

# external
anyhow = "1"
dirs = "7"
global-hotkey = "0.10"
png = "0.18"
proptest = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tray-icon = "0.26"
windows = "0.62"
windows-numerics = "0.3"
winit = "0.30"
winresource = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
cognitive_complexity = "warn"
excessive_nesting = "warn"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
